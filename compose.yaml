services:
  mongo:
    image: mongo:latest
    hostname: mongo
    command:
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./bin/worker"]
    environment:
      - MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0
      - MONGODB_DATABASE=conduit
      - REDIS_URI=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./bin/api"]
    ports:
      - 8080:8080
    environment:
      - MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0
      - MONGODB_DATABASE=conduit
      - REDIS_URI=redis://redis:6379
      - PORT=8080
      - API_KEY=change-me
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - 80:80
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
