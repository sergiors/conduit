services:
  mongo:
    image: mongo:latest
    hostname: mongo
    command:
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  conduit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conduit
    command: ["conduit", "start"]
    env_file: .env.dev
    ports:
      - 8080:8080
      - 9090:9090
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "conduit", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
  redis_data:
